services:
  - type: web
    name: escalera-del-liderazgo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: CONTROL_PIN
        sync: false
    autoDeploy: true
